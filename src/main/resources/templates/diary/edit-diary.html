<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일기 수정 및 삭제</title>
    <style>
        .container { width: 600px; margin: 50px auto; font-family: 'Pretendard', sans-serif; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="date"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
        }
        textarea { height: 250px; resize: none; line-height: 1.6; }

        /* 버튼 레이아웃 */
        .button-area {
            display: flex; justify-content: space-between; align-items: center; margin-top: 30px;
            padding-top: 20px; border-top: 1px solid #eee;
        }
        .right-buttons { display: flex; gap: 10px; }

        button, .btn-link {
            padding: 10px 20px; border-radius: 6px; cursor: pointer; border: none; font-size: 14px; text-decoration: none;
        }
        .btn-edit { background-color: #4A90E2; color: white; font-weight: bold; }
        .btn-delete { background-color: #FF4D4F; color: white; }
        .btn-cancel { background-color: #f0f0f0; color: #666; }

        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 일기 수정 / 삭제</h2>
    <p style="color: #888;">작성한 내용을 수정하거나 삭제할 수 있습니다.</p>

    <form th:action="@{/diary/edit/{id}(id=${diary.diaryId})}" method="post" id="editForm">
        <div class="form-group">
            <label for="recordDay">날짜 선택</label>
            <input type="date" id="recordDay" name="recordDay" th:value="${diary.recordDay}" required>
        </div>

        <div class="form-group">
            <label for="content">오늘의 일기</label>
            <textarea id="content" name="content" th:text="${diary.content}" required></textarea>
        </div>
    </form>

    <div class="button-area">
        <form th:action="@{/diary/delete/{id}(id=${diary.diaryId})}" method="post">
            <button type="submit" class="btn-delete"
                    onclick="return confirm('정말로 이 일기를 삭제하시겠습니까? 삭제 후에는 복구할 수 없습니다.')">
                🗑️ 일기 삭제
            </button>
        </form>

        <div class="right-buttons">
            <a href="/diary" class="btn-link btn-cancel">취소</a>
            <button type="submit" form="editForm" class="btn-edit">✅ 수정 완료</button>
        </div>
    </div>
</div>

</body>
</html>
