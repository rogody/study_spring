<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일기 목록</title>
    <style>
        .container { width: 800px; margin: 20px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .no-data { text-align: center; padding: 20px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 나의 일기장</h1>
    <a href="/diary/new">새 일기 쓰기</a>
    <hr>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>기록 날짜</th>
            <th>내용</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="diary : ${diaries}">
            <td th:text="${diary.diaryId}">1</td>
            <td th:text="${diary.recordDay}">2026-02-12</td>
            <td th:text="${diary.content}">일기 내용...</td>
        </tr>

        <tr th:if="${diaries.isEmpty()}">
            <td colspan="3" class="no-data">아직 작성된 일기가 없습니다. 첫 일기를 작성해 보세요!</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
